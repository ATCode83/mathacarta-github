<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathaCarta PDF reader</title><link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css"><link rel="stylesheet" href="reader.css"></head><body>
<header><strong>MathaCarta · PDF reader</strong><label>Open local PDF <input id="file" type="file" accept="application/pdf,.pdf"></label><form id="remote"><input id="url" type="url" placeholder="https://arxiv.org/pdf/…" aria-label="PDF web address" required><button>Open URL</button></form></header>
<nav><button id="prev" disabled>Previous</button><label>Page <input id="page" type="number" min="1" value="1" disabled></label><span id="total">/ 0</span><button id="next" disabled>Next</button><label>Zoom <select id="zoom" disabled><option value="0.75">75%</option><option value="1">100%</option><option value="1.25" selected>125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label><input type="checkbox" id="auto" checked> Search on highlight</label></nav>
<p id="status" role="status">Open a PDF to begin. Local files stay on this device. Highlighted text is automatically sent to arXiv when automatic search is enabled.</p><main id="pages"></main>
<script src="popup-core.js"></script><script src="highlight.js"></script><script type="module" src="reader.js"></script></body></html>
